[project]
name = "kidstory-api"
version = "0.2.0"
description = "FastAPI service for the Kidstory story catalog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "huggingface_hub>=1.0",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
